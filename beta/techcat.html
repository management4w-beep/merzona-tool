/* =====================================================================================

   نفس معلومات "الكتالوج الفني" بالداشبورد (من كتالوجات المصنّعين الرسمية)، بس مرتّبة حسب نوع النظام،

:root{--ink:#16232d;--muted:#5d6b75;--line:#dfe5ea;--accent:#0f88cd;--soft:#f3f6f9;--paper:#fff;--gold:#a77a45}

html,body{margin:0;background:#e9edf1;color:var(--ink);font-family:Tajawal,Cairo,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.65}
a{color:var(--accent)}
.bar{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar .t{flex:1;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button,.bar a{font:inherit;font-size:14px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;white-space:nowrap}
.bar .pri{background:var(--accent);border-color:var(--accent)}
.doc{max-width:960px;margin:18px auto 60px;padding:0 12px}
.page{background:var(--paper);border-radius:6px;box-shadow:0 2px 10px rgba(16,35,45,.08);padding:34px 40px;margin-bottom:18px}

.cover{min-height:78vh;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,#ffffff 0%,#f2f6f9 55%,#e3ecf2 100%);position:relative;overflow:hidden}
.cover:after{content:"";position:absolute;inset:auto -10% -30% 40%;height:70%;background:repeating-linear-gradient(115deg,rgba(15,136,205,.07) 0 2px,transparent 2px 26px);transform:rotate(-4deg)}
.cover .logo{height:92px;width:auto;object-fit:contain}
.cover h1{font-size:40px;line-height:1.2;margin:0 0 6px;letter-spacing:-.5px}

.cover .lead{max-width:600px;color:var(--muted);font-size:16px}
.cover .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);position:relative;z-index:1}

.code{font-family:"DM Mono",ui-monospace,Consolas,monospace;font-size:12px;background:var(--ink);color:#fff;border-radius:6px;padding:3px 8px;direction:ltr;white-space:nowrap;margin-top:6px}
.sys h3{margin:0;font-size:20px;line-height:1.35;flex:1;min-width:240px}
.sys h3 .en{display:block;font-size:13.5px;color:var(--muted);font-weight:500;direction:ltr;text-align:right}
.maker{font-size:12.5px;color:var(--muted);margin-top:2px}
.desc{margin:10px 0 12px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
table.spec{width:100%;border-collapse:collapse;font-size:13.5px}

table.spec td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.spec th small{display:block;font-weight:400;font-size:11px;direction:ltr;text-align:right;opacity:.8}
ul.feat{margin:12px 0 0;padding:0 18px 0 0;font-size:13.5px}

.depth-t{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}

.depth-t th{background:var(--soft)}
.toc ol{columns:2;column-gap:28px;padding-right:18px;margin:10px 0 0}
@media(max-width:640px){.toc ol{columns:1}}
.toc li{margin:4px 0;break-inside:avoid}
.toc li small{color:var(--muted);direction:ltr;display:inline-block}
.note{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:14px}
.gl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 22px;font-size:13.5px}

.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}

@media print{

  a{color:inherit;text-decoration:none}

<script>
(function(){
'use strict';
const CATALOG_IMAGES_DIR = '../catalog-images/';
const IMG = (f) => CATALOG_IMAGES_DIR + 'tc/' + f.replace(/\.(png|jpe?g)$/i, '') + '.jpg';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

/* ---------- مقاطع توضيحية مرسومة (للأنظمة يلي ما إلها رسمة رسمية بين إيدينا) ---------- */
const S = {
  al: 'fill="#cfd8de" stroke="#33434d" stroke-width="1.4"', tb: 'fill="url(#tbh)" stroke="#33434d" stroke-width="1"',
  gl: 'fill="#d6ecf7" stroke="#5b94b3" stroke-width="1.2"', gk: 'fill="#2d3a42"', dim: 'stroke="#a77a45" stroke-width="1" fill="none"',
};
function svgWrap(w, h, body){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg" role="img" direction="ltr" style="direction:ltr" font-family="Tajawal,Arial,sans-serif">' +
    '<defs><pattern id="tbh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f2e3c9"/><line x1="0" y1="0" x2="0" y2="6" stroke="#a77a45" stroke-width="1.6"/></pattern>' +
    '<marker id="ar" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L7 4 L0 7z" fill="#a77a45"/></marker></defs>' +
    '<rect width="' + w + '" height="' + h + '" fill="#fff"/>' + body + '</svg>';
}
const lbl = (x, y, t, a) => '<text x="' + x + '" y="' + y + '" font-size="11" fill="#33434d" text-anchor="' + (a || 'start') + '">' + t + '</text>';
const dimH = (x1, x2, y, t) => '<line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" ' + S.dim + ' marker-start="url(#ar)" marker-end="url(#ar)"/>' + '<text x="' + ((x1 + x2) / 2) + '" y="' + (y - 4) + '" font-size="11" fill="#a77a45" text-anchor="middle">' + t + '</text>';
const dimV = (x, y1, y2, t) => '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + y2 + '" ' + S.dim + ' marker-start="url(#ar)" marker-end="url(#ar)"/>' + '<text x="' + (x - 5) + '" y="' + ((y1 + y2) / 2) + '" font-size="11" fill="#a77a45" text-anchor="end">' + t + '</text>';
const SCHEMES = {
  // مفصلي: فريم + دفة + زجاج + غاسكيت، مع/بلا عازل حراري
  hinged(o){
    o = o || {}; const tb = !!o.tb, D = o.depth || 'D';
    let b = '';
    // الفريم (شكل L)
    b += '<path d="M60 70 h60 v' + (tb ? 24 : 0) + ' M60 70 v170 h60 v-60 h-36 v-110 z" ' + S.al + '/>';
    b += tb ? '<rect x="60" y="138" width="60" height="14" ' + S.tb + '/>' : '';
    // الدفة
    b += '<path d="M124 96 h62 v150 h-62 z" ' + S.al + '/>' + (tb ? '<rect x="124" y="160" width="62" height="14" ' + S.tb + '/>' : '');
    b += '<rect x="196" y="40" width="' + (o.dg ? 24 : 10) + '" height="220" ' + S.gl + '/>' + (o.dg ? '<line x1="208" y1="40" x2="208" y2="260" stroke="#5b94b3" stroke-dasharray="3 3"/>' : '');
    b += '<rect x="186" y="104" width="10" height="16" ' + S.gk + '/><rect x="' + (o.dg ? 220 : 206) + '" y="104" width="8" height="16" ' + S.gk + '/><rect x="' + (o.dg ? 220 : 206) + '" y="96" width="22" height="34" ' + S.al + '/>';
    b += '<rect x="116" y="100" width="8" height="12" ' + S.gk + '/><rect x="116" y="226" width="8" height="12" ' + S.gk + '/>';
    b += dimH(60, 186, 282, D) + lbl(250, 60, 'زجاج / Glazing') + lbl(20, 60, 'فريم / Frame') + lbl(250, 200, 'بيدة / Glazing bead') + lbl(130, 30, 'دفة / Sash');
    if(tb) b += lbl(250, 160, 'عازل حراري / Polyamide');
    return svgWrap(400, 300, b);
  },
  // حلقة مخفية: الدفة وراء الفريم، ما بيبيّن غير الفريم من برّا
  hidden(){
    let b = '<path d="M70 60 h46 v190 h-46 z" ' + S.al + '/><rect x="70" y="146" width="46" height="14" ' + S.tb + '/>';
    b += '<path d="M120 70 h40 v170 h-40 z" ' + S.al + '/><rect x="120" y="150" width="40" height="12" ' + S.tb + '/>';
    b += '<rect x="164" y="40" width="26" height="230" ' + S.gl + '/><line x1="177" y1="40" x2="177" y2="270" stroke="#5b94b3" stroke-dasharray="3 3"/>';
    b += '<rect x="160" y="80" width="6" height="14" ' + S.gk + '/><rect x="190" y="80" width="6" height="14" ' + S.gk + '/>';
    b += dimH(70, 116, 290, '45') + dimH(120, 160, 290, '60') + lbl(210, 70, 'دفة مخفية خلف الفريم') + lbl(210, 88, 'Hidden sash') + lbl(210, 160, 'زجاج مزدوج / IGU') + lbl(14, 50, 'من برّا / Outside');
    return svgWrap(400, 310, b);
  },
  // سحّاب رأسي (غيلوتين): بروفايل نحيف 21 ملم + مسارات
  guillotine(){
    let b = '<rect x="40" y="40" width="320" height="220" fill="none" stroke="#33434d" stroke-width="1.4"/>';
    b += '<rect x="60" y="52" width="280" height="96" ' + S.gl + '/><rect x="60" y="148" width="280" height="98" ' + S.gl + ' opacity=".75"/>';
    b += '<rect x="60" y="142" width="280" height="8" ' + S.al + '/>';
    b += '<path d="M200 120 v-40 M190 92 l10 -12 l10 12" stroke="#a77a45" stroke-width="2" fill="none"/>';
    b += dimV(30, 142, 150, '21') + lbl(360, 30, 'Minimal vertical sliding', 'end') + lbl(70, 275, 'بروفايل التقاء نحيف 21 ملم — حركة يدوية أو موتور');
    return svgWrap(400, 290, b);
  },
  // درابزين: قناة أرضية (Base shoe) + زجاج + إسفين
  balustrade(){
    let b = '<rect x="20" y="230" width="360" height="40" fill="#e8e3da" stroke="#8b8172"/>' + lbl(28, 262, 'بلاطة / Slab');
    b += '<path d="M150 150 h100 v80 h-100 z M172 150 v62 h56 v-62" ' + S.al + '/>';
    b += '<rect x="193" y="30" width="14" height="182" ' + S.gl + '/>';
    b += '<path d="M176 160 l14 0 l0 46 l-14 0 z M210 160 l14 0 l0 46 l-14 0 z" fill="#2d3a42"/>';
    b += '<rect x="186" y="16" width="28" height="18" rx="4" ' + S.al + '/>';
    b += '<line x1="200" y1="232" x2="200" y2="262" stroke="#33434d" stroke-dasharray="4 3"/>';
    b += dimH(150, 250, 140, 'Base channel 65–150') + lbl(262, 60, 'زجاج سيكوريت مقسّى') + lbl(262, 76, 'Tempered / laminated') + lbl(262, 190, 'إسفين وغاسكيت') + lbl(262, 22, 'هاندريل علوي');
    return svgWrap(400, 290, b);
  },
  // لوفر: شفرات مائلة على حامل
  louver(){
    let b = '<rect x="60" y="30" width="16" height="240" ' + S.al + '/><rect x="324" y="30" width="16" height="240" ' + S.al + '/>';
    for(let i = 0; i < 6; i++){ const y = 48 + i * 38; b += '<path d="M80 ' + y + ' q120 -26 240 0 l0 10 q-120 -26 -240 0 z" transform="rotate(-8 200 ' + y + ')" ' + S.al + '/>'; }
    b += dimV(44, 48, 86, 'خطوة') + lbl(345, 290, 'شفرات 45–500 ملم (مسطحة / منحنية / Z)', 'end');
    return svgWrap(400, 300, b);
  },
  // تزجيج جاف: قناة U + غاسكيت EPDM من الجهتين
  dryglaze(){
    let b = '<path d="M130 150 h140 v110 h-140 z M152 150 v86 h96 v-86" ' + S.al + '/>';
    b += '<rect x="193" y="30" width="14" height="206" ' + S.gl + '/>';
    b += '<path d="M156 156 h34 v76 h-34 z M210 156 h34 v76 h-34 z" fill="#2d3a42"/>';
    b += lbl(262, 70, 'زجاج 8 / 10 / 12 ملم') + lbl(262, 190, 'غاسكيت EPDM محيطي') + lbl(262, 206, 'بلا سيليكون ولا غراء') + dimH(130, 270, 276, 'TwinPro');
    return svgWrap(400, 300, b);
  },
};

/* ---------- المحتوى (من كتالوجات المصنّعين - مرتّب للمهندسين) ---------- */
const FIN = 'باودر كوتينغ (PE-F / SDF / HDF) أو أنودايز (طبيعي، ذهبي، برونزي، سبكترو)';
const CATS = [
 { id: 'sliding', ar: 'أنظمة السحّاب', en: 'Sliding Systems', intro: 'من السحّاب الاقتصادي غير الحراري لأنظمة الرفع والسحب والأنظمة النحيفة متعددة المسارات بعتبة مخفية.', sys: [
  { code: 'MZ-SL-01', ar: 'The Next — سحّاب حراري متعدد المسارات', en: 'The Next — Thermally-broken multi-track sliding', maker: 'AGBS / Gulf Extrusions',

      ['أقصى درفة', 'Max. sash', 'ارتفاع 3.50 م · عرض 2.00 م · وزن حتى 230 كغ'], ['الأداء', 'Performance', 'تسرب هواء 300–600 Pa · مياه 600 Pa (ساكن/ديناميكي) · رياح تصميمية حتى 2000 Pa · أمان WK2 (DIN ENV 1627)'],

    img: [['next-frame-2track.jpg', 'فريم ثنائي المسار'], ['next-frame-3track.jpg', 'فريم ثلاثي المسار'], ['next-sill-family.jpg', 'عائلة العتبات'], ['next-jamb-2track-detail.jpg', 'تفصيل الجانب — ثنائي'], ['next-jamb-3track-detail.jpg', 'تفصيل الجانب — ثلاثي'], ['next-mullion-coupling.jpg', 'وصلة تجميع']] },
  { code: 'MZ-SL-02', ar: 'The Glide — رفع وسحب', en: 'The Glide — Lift & Slide', maker: 'Gulf Extrusions',

  if(s.depthTable) h += '<table class="depth-t"><tr><th>العرض الظاهر (ملم)</th><th>عمق العمود (ملم)</th><th>ملاحظة</th></tr>' + s.depthTable.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</table>';
  if(s.feat) h += '<ul class="feat">' + s.feat.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>';
  h += '</div><div>';
  if(s.img){ const n = s.img.length; h += '<div class="figs' + (n === 1 ? ' one' : '') + '">' + s.img.map(x => fig(x[0], x[1])).join('') + '</div>'; }
  if(s.scheme){ const fn = SCHEMES[s.scheme[0]]; h += '<div class="figs one"><figure>' + fn(s.scheme[1]) + '<figcaption><span class="sch">' + esc(s.scheme[2]) + '</span> — رسم مبسّط للتوضيح، مش بمقياس. الأبعاد المعتمدة حسب مخططات التصنيع.</figcaption></figure></div>'; }
  return h + '</div></div></section>';
}
function render(){
  const c = co(), name = c.nameEn || 'Merzona', nameAr = c.nameAr || 'ميرزونا';

    '<div class="cats">' + CATS.map(k => '<span>' + esc(k.ar) + '</span>').join('') + '</div></div>' +
    '<div class="meta"><span>' + esc(nameAr) + ' · ' + esc(c.fullNameEn || name) + '</span>' + (c.cities ? '<span>📍 ' + esc(c.cities) + '</span>' : '') + (c.phone ? '<span dir="ltr">☎ ' + esc(c.whatsapp || c.phone) + '</span>' : '') + (c.email ? '<span dir="ltr">✉ ' + esc(c.email) + '</span>' : '') + '<span>إصدار ' + new Date().getFullYear() + '</span></div></div>';
  h += '<div class="page toc"><h2 class="cat">المحتويات <span class="en">Contents</span></h2><ol>' + CATS.map(k => '<li><b>' + esc(k.ar) + '</b> <small>' + esc(k.en) + '</small><ul style="padding-right:16px;margin:2px 0 8px;font-size:13px">' + k.sys.map(s => '<li><a href="#' + esc(s.code) + '">' + esc(s.code) + ' — ' + esc(s.ar) + '</a></li>').join('') + '</ul></li>').join('') + '</ol>' +
    '<h2 class="cat" style="margin-top:26px">مصطلحات ومعايير <span class="en">Glossary & standards</span></h2><div class="gl" style="margin-top:12px">' +
    '<div><b>Uw — معامل الانتقال الحراري للفتحة</b>كل ما قلّ الرقم كان العزل أفضل (W/m²K).</div><div><b>Thermal break — عازل حراري</b>شريط بولي أميد بيفصل الألمنيوم الداخلي عن الخارجي.</div>' +
    '<div><b>ASTM E283 / E331 / E330</b>اختبارات تسرب الهواء، تسرب المياه، والأداء الإنشائي تحت ضغط الرياح.</div><div><b>DIN ENV 1627 — WK2</b>تصنيف مقاومة الاقتحام.</div>' +
    '<div><b>SSG — تزجيج إنشائي</b>الزجاج ملصوق بسيليكون إنشائي بلا أغطية ظاهرة.</div><div><b>Qualicoat / Qualanod</b>شهادات جودة الدهان البودرة والأنودايز.</div></div>' +
    '<div class="note">القيم بهالكتالوج مأخوذة من كتالوجات المصنّعين الرسمية لكل نظام، وهي للتصميم الأولي واختيار النظام. المقاطع النهائية وسماكات الزجاج والتقويات بتتحدّد لكل مشروع حسب المقاسات والأحمال والحسابات الإنشائية، وبتنعطى بمخططات التصنيع (Shop drawings). الرسومات المكتوب عليها «مقطع توضيحي» مبسّطة وليست بمقياس.</div></div>';
  CATS.forEach(k => { h += '<div class="page" id="cat-' + k.id + '"><h2 class="cat">' + esc(k.ar) + ' <span class="en">' + esc(k.en) + '</span></h2><p class="cat-intro">' + esc(k.intro) + '</p>' + k.sys.map(sysHTML).join('') + '</div>'; });
  h += '<div class="page"><h2 class="cat">التشطيبات والخدمات <span class="en">Finishes & services</span></h2><div class="gl" style="margin-top:14px">' +
    '<div><b>دهان بودرة — Powder coating</b>بوليستر (PE-F)، سوبر ديورابل (SDF)، هايبر ديورابل (HDF)، أو PVDF — كل ألوان RAL، بمعايير Qualicoat.</div>' +
    '<div><b>أنودايز — Anodizing</b>طبيعي، ذهبي، برونزي، سبكترو — سماكة 5 – 30 ميكرون، بمعايير Qualanod.</div>' +
    '<div><b>الزجاج — Glazing</b>مفرد، مزدوج، أو ثلاثي؛ مقسّى، لامينيت، Low-E، عاكس، أو ملوّن — حسب متطلبات العزل والأمان.</div>' +
    '<div><b>الخدمات — Services</b>رفع مقاسات بالموقع، مخططات تصنيع، تصنيع، تركيب، وصيانة.</div></div>' +
    '<div class="foot" style="margin-top:30px;border-top:1px solid var(--line);padding-top:14px"><span>' + esc(nameAr) + ' — ' + esc(c.fullNameEn || name) + '</span><span dir="ltr">' + esc([c.whatsapp || c.phone, c.email, c.website].filter(Boolean).join(' · ')) + '</span></div></div>';
  document.getElementById('doc').innerHTML = h;
  if(window.MzCompany && MzCompany.applyNode) try{ MzCompany.applyNode(document.getElementById('doc'), true); }catch(e){}
}
window.TC = {
  zoom(src){ document.getElementById('zoomImg').src = src; document.getElementById('zoom').style.display = 'flex'; },
  share(){ const u = location.href.split('#')[0]; const t = (co().nameEn || 'Merzona') + ' — الكتالوج الفني'; if(navigator.share) navigator.share({ title: t, url: u }).catch(() => {}); else { try{ navigator.clipboard.writeText(u); alert('انسخ الرابط: ' + u); }catch(e){ prompt('الرابط:', u); } } },
  CATS, SCHEMES,
};
render();
window.addEventListener('mz-company', render);
})();
