<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>صفحتي - Merzona</title>
<style>
  :root{
    --accent:#A15C1E;
    --ink:#1a1a2e;
    --muted:#6b6b6b;
    --line:#d8d8d8;
    --paper:#ffffff;
    --bg:#eef1f4;
    --ok:#1a7a3a;
    --danger:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:18px 14px 40px;
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI','Tahoma','Inter',Arial,sans-serif;
    font-size:15px;
    line-height:1.6;
  }
  .card{
    max-width:560px;
    margin:0 auto;
    background:var(--paper);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,0.08);
    padding:22px 20px;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand h1{
    font-size:19px;
    margin:0 0 4px;
    color:var(--accent);
  }
  .brand p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  .state{ display:none; }
  .state.show{ display:block; }
  .center{ text-align:center; }
  .spinner{
    width:34px; height:34px;
    border:3px solid #eee;
    border-top-color:var(--accent);
    border-radius:50%;
    margin:20px auto;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .warn-icon, .ok-icon{ font-size:40px; margin-bottom:6px; }
  h2.state-title{
    font-size:17px;
    margin:4px 0 10px;
    text-align:center;
  }
  p.state-sub{
    font-size:13px;
    color:var(--muted);
    text-align:center;
    margin:0 0 14px;
  }
  .err-text{
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
  }
  .profile{
    text-align:center;
    margin-bottom:16px;
  }
  .profile h2{
    font-size:20px;
    margin:0 0 4px;
  }
  .profile p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
  }
  .totals{
    display:flex;
    gap:10px;
    margin:14px 0 18px;
  }
  .totals .box{
    flex:1;
    background:#faf6ef;
    border:1px solid #e8dcc8;
    border-radius:8px;
    padding:12px 10px;
    text-align:center;
  }
  .totals .box.due{ background:rgba(192,57,43,.07); border-color:rgba(192,57,43,.25); }
  .totals .box .k{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .totals .box .v{
    font-size:17px;
    font-weight:700;
  }
  .totals .box.due .v{ color:var(--danger); }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
    margin-top:4px;
  }
  thead th{
    text-align:right;
    padding:7px 6px;
    border-bottom:2px solid var(--line);
    color:var(--muted);
    font-size:11.5px;
    font-weight:600;
  }
  tbody td{
    padding:8px 6px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:last-child td{ border-bottom:none; }
  td.num{ text-align:left; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .status-pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
  }
  .status-paid{ background:rgba(30,122,61,.12); color:var(--ok); }
  .status-due{ background:rgba(192,57,43,.10); color:var(--danger); }
  .note{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
  }
  .empty-note{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:20px 0;
  }
  .fine-print{
    text-align:center;
    font-size:10.5px;
    color:#9a9a9a;
    margin-top:18px;
  }
  .refresh-note{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:14px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>Merzona</h1>
    <p>صفحتي - الرواتب والمستحقات &nbsp;|&nbsp; My salary page</p>
  </div>

  <!-- 1) جاري التحميل -->
  <div class="state show" id="state-loading">
    <div class="spinner"></div>
    <p class="center" style="color:var(--muted);font-size:13.5px;">جاري تحميل بياناتك...</p>
  </div>

  <!-- 2) خطأ -->
  <div class="state" id="state-error">
    <div class="center">
      <div class="warn-icon">⚠️</div>
      <h2 class="state-title" id="error-title">تعذّر فتح الصفحة</h2>
      <p class="err-text" id="error-detail"></p>
    </div>
  </div>

  <!-- 3) المحتوى -->
  <div class="state" id="state-content">
    <div class="profile">
      <h2 id="empName"></h2>
      <p id="empRole"></p>
    </div>

    <div class="totals">
      <div class="box due">
        <div class="k">المستحق حالياً</div>
        <div class="v" id="totalDue">—</div>
      </div>
      <div class="box">
        <div class="k">إجمالي المدفوع</div>
        <div class="v" id="totalPaid">—</div>
      </div>
    </div>

    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <p class="empty-note" id="emptyNote" style="display:none;">ما في سجلات مسجّلة لسا</p>

    <p class="refresh-note">هاي الصفحة بتتحدّث أول ما تفتحها من جديد - إذا لسا ما شفت آخر تحديث، أعد تحميل الصفحة.</p>
  </div>

  <div class="fine-print">Merzona for Aluminum &amp; Glass Works</div>
</div>

<script>
const API_BASE = 'https://merzona-server-production.up.railway.app';

function qs(name){
  return new URLSearchParams(window.location.search).get(name) || '';
}
const EMP = (qs('emp') || '').trim();
const TOKEN = (qs('t') || '').trim();

function showState(id){
  document.querySelectorAll('.state').forEach(el=> el.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}
function showError(title, detail){
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-detail').textContent = detail || '';
  showState('state-error');
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const CURRENCY_LABEL = { AED:'د.إ', USD:'$' };
function fmtMoney(n, currency){
  const num = Number(n) || 0;
  return num.toLocaleString('en-US', {maximumFractionDigits:2}) + ' ' + (CURRENCY_LABEL[currency] || currency || '');
}
function fmtDate(iso){
  if(!iso) return '—';
  const parts = String(iso).slice(0,10).split('-');
  if(parts.length!==3) return iso;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}
const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function fmtMonth(iso){
  if(!iso) return '—';
  const parts = String(iso).split('-');
  if(parts.length<2) return iso;
  const idx = parseInt(parts[1],10)-1;
  return (MONTHS_AR[idx]||parts[1]) + ' ' + parts[0];
}

async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), timeoutMs || 15000);
  try{
    return await fetch(url, Object.assign({}, options, {signal: controller.signal}));
  } finally { clearTimeout(timer); }
}

function handleApiError(status, err){
  if(status === 404 || err === 'not-found'){
    showError('ما لقينا صفحتك', 'يمكن الرابط قديم - تواصل مع Merzona للحصول على رابط محدّث.');
  } else if(status === 401 || err === 'invalid-token'){
    showError('الرابط غير صالح', 'هالرابط مش صحيح - تواصل مع Merzona للحصول على رابطك الصحيح.');
  } else if(status === 429 || err === 'rate-limit'){
    showError('محاولات كتيرة بوقت قصير', 'جرب تفتح الصفحة كمان مرة بعد شوي.');
  } else if(status === 503 || err === 'not-linked-yet'){
    showError('الصفحة مش جاهزة بعد', 'تواصل مع Merzona.');
  } else {
    showError('صار خطأ غير متوقع', 'جرب تفتح الصفحة كمان مرة، وإذا استمرت المشكلة تواصل مع Merzona.');
  }
}

function renderContent(data){
  document.getElementById('empName').textContent = data.name || '';
  document.getElementById('empRole').textContent = data.payType === 'monthly'
    ? (data.role ? data.role + ' — راتب شهري' : 'راتب شهري')
    : (data.role ? data.role + ' — أجر يومي' : 'أجر يومي');

  let totalDue = 0, totalPaid = 0;
  const currency = data.currency || 'AED';
  (data.entries || []).forEach(e=>{
    if(e.paid) totalPaid += (e.amount||0); else totalDue += (e.amount||0);
  });
  document.getElementById('totalDue').textContent = fmtMoney(totalDue, currency);
  document.getElementById('totalPaid').textContent = fmtMoney(totalPaid, currency);

  const isMonthly = data.payType === 'monthly';
  document.getElementById('tableHead').innerHTML = isMonthly
    ? '<tr><th>الشهر</th><th>المبلغ</th><th>الحالة</th><th>تاريخ الدفع</th></tr>'
    : '<tr><th>التاريخ</th><th>المبلغ</th><th>الحالة</th><th>تاريخ الدفع</th></tr>';

  const tbody = document.getElementById('tableBody');
  const entries = data.entries || [];
  if(!entries.length){
    tbody.innerHTML = '';
    document.getElementById('emptyNote').style.display = '';
  } else {
    document.getElementById('emptyNote').style.display = 'none';
    tbody.innerHTML = entries.map(e=>{
      const label = isMonthly ? fmtMonth(e.month) : fmtDate(e.date);
      const noteHtml = (!isMonthly && e.note) ? '<div class="note">'+escapeHtml(e.note)+'</div>' : '';
      const statusHtml = e.paid
        ? '<span class="status-pill status-paid">✓ مدفوع</span>'
        : '<span class="status-pill status-due">⏳ مستحق</span>';
      return '<tr>'+
        '<td>'+escapeHtml(label)+noteHtml+'</td>'+
        '<td class="num">'+fmtMoney(e.amount, e.currency||currency)+'</td>'+
        '<td>'+statusHtml+'</td>'+
        '<td style="font-size:12px;color:var(--muted);">'+(e.paid ? fmtDate(e.paidAt ? new Date(e.paidAt).toISOString() : null) : '—')+'</td>'+
        '</tr>';
    }).join('');
  }

  showState('state-content');
}

async function loadInfo(){
  if(!EMP || !TOKEN){
    showError('رابط غير صالح', 'الرابط ناقص معلومات - تأكد إنك فاتح الرابط كامل يلي انبعتلك.');
    return;
  }
  try{
    const res = await fetchWithTimeout(API_BASE + '/payroll/' + encodeURIComponent(EMP) + '?t=' + encodeURIComponent(TOKEN), {}, 15000);
    const data = await res.json().catch(()=> ({}));
    if(!res.ok || !data.ok){
      handleApiError(res.status, data && data.error);
      return;
    }
    renderContent(data);
  }catch(e){
    showError('تعذّر الاتصال بالسيرفر', 'تأكد من اتصالك بالإنترنت وحاول تاني بعد شوي.');
  }
}

loadInfo();
</script>
</body>
</html>
