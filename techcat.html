 ]},

const SECMAP = {}; CATS.forEach(k => k.sys.forEach(x => { try{ const sc = sectionFor(x); if(sc) SECMAP[x.code] = sc; }catch(e){ console.error('[section]', x.code, e); } }));
/* ---------- العرض ---------- */
function co(){ try{ return (window.MzCompany && MzCompany.get) ? MzCompany.get() : {}; }catch(e){ return {}; } }
function fig(src, cap){ return '<figure><img loading="lazy" src="' + IMG(src) + '" alt="' + esc(cap) + '" onclick="TC.zoom(this.src)"><figcaption>' + esc(cap) + '</figcaption></figure>'; }
function sysHTML(s){
  let h = '<section class="sys" id="' + esc(s.code) + '"><div class="sys-h"><span class="code">' + esc(s.code) + '</span><h3>' + esc(s.ar) + '<span class="en">' + esc(s.en) + '</span></h3><button type="button" class="tc-share no-print" onclick="TC.shareOne(\'' + esc(s.code) + '\')">📤 ابعت هالنظام</button></div>';
  if(s.maker) h += '<div class="maker">النظام / المصنّع: ' + esc(s.maker) + '</div>';
  h += '<p class="desc">' + esc(s.desc) + '</p><div class="grid"><div>';
  if(s.spec) h += '<table class="spec">' + s.spec.map(r => '<tr><th>' + esc(r[0]) + '<small>' + esc(r[1]) + '</small></th><td>' + esc(r[2]) + '</td></tr>').join('') + '</table>';
  if(s.depthTable) h += '<table class="depth-t"><tr><th>العرض الظاهر (ملم)</th><th>عمق العمود (ملم)</th><th>ملاحظة</th></tr>' + s.depthTable.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</table>';
  if(s.feat) h += '<ul class="feat">' + s.feat.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul>';
  h += '</div><div>';
  if(s.web){ h += '<div class="figs' + (s.web.length === 1 ? ' one' : '') + '" style="margin-bottom:10px">' + s.web.map(x => '<figure class="web"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(x[0]) + '" alt="' + esc(x[1]) + '" onclick="TC.zoom(this.src)" onerror="this.closest(\'figure\').remove()"><figcaption>' + esc(x[1]) + ' <span style="opacity:.7">— المصدر: ' + esc(new URL(x[0]).hostname.replace(/^www\./, '')) + '</span></figcaption></figure>').join('') + '</div>'; }
  const sec = SECMAP[s.code];
  if(sec) h += '<div class="figs one" style="margin-bottom:10px"><figure class="sec2d">' + secSVG(sec) + '<button type="button" class="b3d no-print" onclick="TC.open3D(\'' + esc(s.code) + '\')">🧊 شوفه 3D</button><figcaption><span class="sch">مقطع ميرزونا</span> — ' + (sec.cat ? 'مأخوذ بالملّي من الرسمة الأصلية (' + esc(sec.src) + ')، وكل قطعة بالمجسّم 3D لحالها: فيك تفكّ القطع وترجّعها، وتكبس على أي قطعة لتعرف اسمها ورقمها.' : sec.src ? 'مرسوم من المقاسات المكتوبة لـ' + esc(sec.src) + ' بكتالوج المصنّع، والمجسّم 3D بنفس الشكل تماماً. الرسمة الرسمية تحت.' : s.img ? 'مبني على الأبعاد المنشورة للنظام، والمجسّم 3D بنفس الشكل تماماً. رسومات المصنّع الرسمية تحت.' : 'مقطع نموذجي للنظام، والمجسّم 3D بنفس الشكل تماماً.') + ' الأبعاد النهائية حسب مخططات التصنيع.</figcaption></figure></div>';
  if(s.img){ const n = s.img.length; h += '<div class="figs' + (n === 1 ? ' one' : '') + '">' + s.img.map(x => fig(x[0], x[1])).join('') + '</div>'; }
  return h + '</div></div></section>';
}
function render(){
  const c = co(), name = c.nameEn || 'Merzona', nameAr = c.nameAr || 'ميرزونا';
  const VC = CATS.map(k => Object.assign({}, k, { sys: MANAGE ? k.sys : k.sys.filter(s => !HIDDEN.has(s.code)) })).filter(k => k.sys.length);
  const total = VC.reduce((a, k) => a + k.sys.length, 0);
  document.title = name + ' — الكتالوج الفني | Technical Catalogue';
  let h = '<div class="page cover"><div><img class="logo" data-co-logo src="' + esc(c.logo || 'img/logo.png') + '" alt="Merzona logo"></div>' +
    '<div><h1>الكتالوج الفني لأنظمة الألمنيوم والزجاج<small>Aluminium & Glass Systems — Technical Catalogue</small></h1>' +
    '<p class="lead">مرجع فني للمهندسين والاستشاريين: ' + total + ' نظاماً مع المقاطع والأبعاد والتزجيج والأداء والتشطيبات، من كتالوجات المصنّعين المعتمدة. للتصميم الأولي واختيار النظام المناسب لكل فتحة.</p>' +
    '<div class="cats">' + VC.map(k => '<span>' + esc(k.ar) + '</span>').join('') + '</div></div>' +
    '<div class="meta"><span>' + esc(nameAr) + ' · ' + esc(c.fullNameEn || name) + '</span>' + (c.cities ? '<span>📍 ' + esc(c.cities) + '</span>' : '') + (c.phone ? '<span dir="ltr">☎ ' + esc(c.whatsapp || c.phone) + '</span>' : '') + (c.email ? '<span dir="ltr">✉ ' + esc(c.email) + '</span>' : '') + '<span>إصدار ' + new Date().getFullYear() + '</span></div></div>';
  h += '<div class="page toc"><h2 class="cat">المحتويات <span class="en">Contents</span></h2><ol>' + VC.map(k => '<li><b>' + esc(k.ar) + '</b> <small>' + esc(k.en) + '</small><ul style="padding-right:16px;margin:2px 0 8px;font-size:13px">' + k.sys.map(s => '<li><a href="#' + esc(s.code) + '">' + esc(s.code) + ' — ' + esc(s.ar) + '</a></li>').join('') + '</ul></li>').join('') + '</ol>' +
    '<h2 class="cat" style="margin-top:26px">مصطلحات ومعايير <span class="en">Glossary & standards</span></h2><div class="gl" style="margin-top:12px">' +
    '<div><b>Uw — معامل الانتقال الحراري للفتحة</b>كل ما قلّ الرقم كان العزل أفضل (W/m²K).</div><div><b>Thermal break — عازل حراري</b>شريط بولي أميد بيفصل الألمنيوم الداخلي عن الخارجي.</div>' +
    '<div><b>ASTM E283 / E331 / E330</b>اختبارات تسرب الهواء، تسرب المياه، والأداء الإنشائي تحت ضغط الرياح.</div><div><b>DIN ENV 1627 — WK2</b>تصنيف مقاومة الاقتحام.</div>' +
    '<div><b>SSG — تزجيج إنشائي</b>الزجاج ملصوق بسيليكون إنشائي بلا أغطية ظاهرة.</div><div><b>Qualicoat / Qualanod</b>شهادات جودة الدهان البودرة والأنودايز.</div></div>' +
    '<div class="note">القيم بهالكتالوج مأخوذة من كتالوجات المصنّعين الرسمية لكل نظام، وهي للتصميم الأولي واختيار النظام. المقاطع النهائية وسماكات الزجاج والتقويات بتتحدّد لكل مشروع حسب المقاسات والأحمال والحسابات الإنشائية، وبتنعطى بمخططات التصنيع (Shop drawings). الرسومات المكتوب عليها «مقطع توضيحي» مبسّطة وليست بمقياس.</div></div>';
  VC.forEach(k => { h += '<div class="page" id="cat-' + k.id + '"><h2 class="cat">' + esc(k.ar) + ' <span class="en">' + esc(k.en) + '</span></h2><p class="cat-intro">' + esc(k.intro) + '</p>' + k.sys.map(sysHTML).join('') + '</div>'; });
  h += '<div class="page"><h2 class="cat">التشطيبات والخدمات <span class="en">Finishes & services</span></h2><div class="gl" style="margin-top:14px">' +
    '<div><b>دهان بودرة — Powder coating</b>بوليستر (PE-F)، سوبر ديورابل (SDF)، هايبر ديورابل (HDF)، أو PVDF — كل ألوان RAL، بمعايير Qualicoat.</div>' +
    '<div><b>أنودايز — Anodizing</b>طبيعي، ذهبي، برونزي، سبكترو — سماكة 5 – 30 ميكرون، بمعايير Qualanod.</div>' +
    '<div><b>الزجاج — Glazing</b>مفرد، مزدوج، أو ثلاثي؛ مقسّى، لامينيت، Low-E، عاكس، أو ملوّن — حسب متطلبات العزل والأمان.</div>' +
    '<div><b>الخدمات — Services</b>رفع مقاسات بالموقع، مخططات تصنيع، تصنيع، تركيب، وصيانة.</div></div>' +
    '<div class="foot" style="margin-top:30px;border-top:1px solid var(--line);padding-top:14px"><span>' + esc(nameAr) + ' — ' + esc(c.fullNameEn || name) + '</span><span dir="ltr">' + esc([c.whatsapp || c.phone, c.email, c.website].filter(Boolean).join(' · ')) + '</span></div></div>';
  if(ONE){
    let sys = null, cat = null; CATS.forEach(k => k.sys.forEach(x => { if(x.code === ONE){ sys = x; cat = k; } }));
    if(sys && HIDDEN.has(ONE) && !MANAGE) sys = null;
    const contact = [c.whatsapp || c.phone, c.email, c.website].filter(Boolean);
    h = '<div class="page one-head"><div class="oh"><img class="logo-s" data-co-logo src="' + esc(c.logo || 'img/logo.png') + '" alt="Merzona logo"><div><b>' + esc(nameAr) + ' — الكتالوج الفني</b><div class="en" style="color:var(--muted);font-size:13px;direction:ltr;text-align:right">' + esc(c.fullNameEn || name) + ' — Technical Catalogue</div></div></div></div>';
    h += sys ? '<div class="page"><h2 class="cat">' + esc(cat.ar) + ' <span class="en">' + esc(cat.en) + '</span></h2>' + sysHTML(sys) + '</div>' : '<div class="page"><p>هالنظام مش متوفر حالياً.</p></div>';
    h += '<div class="page"><div class="foot"><span>للاستفسار وعروض الأسعار: ' + esc(nameAr) + '</span><span dir="ltr">' + esc(contact.join(' · ')) + '</span></div><div class="no-print" style="margin-top:12px"><a href="techcat.html">📘 شوف كل الكتالوج الفني (' + total + ' نظام)</a></div></div>';
    if(sys) document.title = sys.ar + ' — ' + name;
  }
  if(MANAGE) h = '<div class="page no-print" id="tcManage" style="border:2px solid var(--accent)"><b>⚙️ وضع الإدارة</b> — طفّي أي نظام ما بدك تعرضه أو وقّفت شغل فيه، وبيختفي فوراً من الرابط يلي عند الزبائن. <span id="tcMsg" style="color:var(--muted)"></span><div style="margin-top:6px;font-size:13px;color:var(--muted)">مطفي هلق: <b id="tcOffN">' + HIDDEN.size + '</b> · <a href="techcat.html" target="_blank">👁️ شوف متل الزبون</a></div></div>' + h;
  document.getElementById('doc').innerHTML = h;
  if(MANAGE) document.querySelectorAll('section.sys').forEach(sec => {
    const code = sec.id, on = !HIDDEN.has(code);
    const sw = document.createElement('label'); sw.className = 'tc-sw no-print';
    sw.innerHTML = '<input type="checkbox" ' + (on ? 'checked' : '') + ' data-code="' + esc(code) + '"> <span>' + (on ? '✅ ظاهر للزبائن' : '⛔ مطفي') + '</span>';
    sw.querySelector('input').addEventListener('change', e => TC.toggle(code, e.target.checked));
    sec.querySelector('.sys-h').appendChild(sw); if(!on) sec.classList.add('off');
  });
  if(window.MzCompany && MzCompany.applyNode) try{ MzCompany.applyNode(document.getElementById('doc'), true); }catch(e){}
}
// ↩️ 2026-11-22: الرجوع بالموبايل بيسكّر الصورة المكبّرة / الثري دي بدل ما يطلع من الصفحة
window.addEventListener('popstate', () => { const z = document.getElementById('zoom'); if(z.style.display === 'flex'){ z.style.display = 'none'; return; } if(document.getElementById('v3').style.display === 'flex') close3D(); });
const pushModal = () => { try{ history.pushState({ tcModal: 1 }, ''); }catch(e){} };
window.TC = {
  zoom(src){ document.getElementById('zoomImg').src = src; document.getElementById('zoom').style.display = 'flex'; pushModal(); },
  share(){ const u = location.href.split('#')[0]; const t = (co().nameEn || 'Merzona') + ' — الكتالوج الفني'; if(navigator.share) navigator.share({ title: t, url: u }).catch(() => {}); else { try{ navigator.clipboard.writeText(u); alert('انسخ الرابط: ' + u); }catch(e){ prompt('الرابط:', u); } } },
  CATS, SECTIONS, SECMAP, open3D(code){ open3D(code); pushModal(); }, close3D(){ if(history.state && history.state.tcModal) history.back(); else close3D(); }, v3Reset, v3Zoom, v3Shot, v3Explode(v){ if(V3 && V3.explode) V3.explode(v); }, v3Move(v){ if(V3 && V3.move) V3.move(v); },
  toggle(code, on){
    if(on) HIDDEN.delete(code); else HIDDEN.add(code);
    const sec = document.getElementById(code); if(sec){ sec.classList.toggle('off', !on); const sp = sec.querySelector('.tc-sw span'); if(sp) sp.textContent = on ? '✅ ظاهر للزبائن' : '⛔ مطفي'; }
    const n = document.getElementById('tcOffN'); if(n) n.textContent = HIDDEN.size;
    const msg = document.getElementById('tcMsg'); if(msg) msg.textContent = '⏳ عم احفظ...';
    const h = { 'Content-Type': 'application/json', 'x-device': ls('merzona-device-token') }; const ss = ls('merzona-session-token'); if(ss) h['x-session'] = ss;
    return fetch(SERVER + '/techcat-settings', { method: 'POST', headers: h, body: JSON.stringify({ hidden: Array.from(HIDDEN) }) }).then(r => r.json().then(j => ({ s: r.status, j }))).then(r => {
      if(msg) msg.textContent = r.s === 200 ? '✅ انحفظ' : (r.s === 403 ? '⚠️ ما عندك صلاحية الكتالوجات' : r.s === 401 ? '⚠️ افتحها من جهاز مسجّل بالسيستم' : '⚠️ ما انحفظ (' + r.s + ')');
    }).catch(() => { if(msg) msg.textContent = '⚠️ ما في اتصال — ما انحفظ'; });
  },
  _hidden: () => Array.from(HIDDEN),
  shareOne(code){
    let sys = null; CATS.forEach(k => k.sys.forEach(x => { if(x.code === code) sys = x; }));
    const u = location.href.split('#')[0].split('?')[0] + '?s=' + encodeURIComponent(code);
    const t = (sys ? sys.ar : code) + ' — ' + (co().nameAr || 'ميرزونا');
    if(navigator.share) navigator.share({ title: t, text: t, url: u }).catch(() => {});
    else window.open('https://wa.me/?text=' + encodeURIComponent(t + '\n' + u), '_blank');
  },
};
render();
fetch(SERVER + '/public/techcat-settings', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(j => { if(j && Array.isArray(j.hidden)){ HIDDEN = new Set(j.hidden); render(); } }).catch(() => {});
window.addEventListener('mz-company', render);
})();
