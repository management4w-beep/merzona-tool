<style id="mz-gate-style">body{display:none!important;}</style>
<script id="mz-error-reporter">
/* 🐞 تسجيل أخطاء تلقائي (2026-10-06): أي خطأ جافاسكربت بالصفحة بيتبعت للسيرفر (من جهاز معتمد بس) مع اسم الصفحة والنسخة ورقم العرض،
   وبيتخزّن كمان نسخة بالمتصفح (localStorage: mz-err-log، آخر 30). ما بيعطّل أي شي لو فشل. */
(function(){
  if(window.__mzErrReporter) return; window.__mzErrReporter = true;
  var PAGE = 'accounting';
  var ENDPOINT = 'https://merzona-server-production.up.railway.app/client-error';
  var seen = {}, sent = 0, winStart = Date.now();
  var NOISE = /ResizeObserver loop|^Script error\.?$|Failed to load resource|NetworkError|Load failed|Failed to fetch|AbortError|aborted|ERR_TUNNEL|net::ERR/i;
  function dev(){ try{ return localStorage.getItem('merzona-device-token') || ''; }catch(e){ return ''; } }
  function refVal(){ try{ var el = document.getElementById('m-ref'); return el ? (el.value || '') : ''; }catch(e){ return ''; } }
  function keep(rec){
    try{
      var arr = JSON.parse(localStorage.getItem('mz-err-log') || '[]'); arr.push(rec);
      localStorage.setItem('mz-err-log', JSON.stringify(arr.slice(-30)));
    }catch(e){}
  }
  function report(kind, msg, stack, src){
    try{
      msg = String(msg == null ? '' : msg).slice(0, 500);
      if(!msg || NOISE.test(msg)) return;
      var key = kind + '|' + msg.slice(0, 120); if(seen[key]) return; seen[key] = 1;
      var now = Date.now(); if(now - winStart > 600000){ winStart = now; sent = 0; } if(++sent > 10) return;
      var rec = { kind: kind, msg: msg, stack: String(stack || '').slice(0, 1500), src: String(src || '').slice(0, 200), page: PAGE, v: window.__mzVersion || '', ref: refVal(), ua: (navigator.userAgent || '').slice(0, 160), t: new Date().toISOString() };
      keep(rec);
      var d = dev(); if(!d) return;
      fetch(ENDPOINT + '?device=' + encodeURIComponent(d), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(rec), keepalive: true }).catch(function(){});
    }catch(e){}
  }
  window.addEventListener('error', function(e){
    if(!e || (e.target && e.target !== window)) return; // أخطاء تحميل ملفات/صور = ضجيج شبكة، منتجاهلها
    report('error', e.message, e.error && e.error.stack, (e.filename || '') + ':' + (e.lineno || ''));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason; report('promise', (r && r.message) ? r.message : r, r && r.stack);
  });
  var origErr = console.error;
  console.error = function(){
    try{
      var parts = [], st = '';
      for(var i = 0; i < arguments.length; i++){
        var x = arguments[i];
        if(x && x.message){ parts.push(x.message); if(!st && x.stack) st = x.stack; }
        else if(typeof x === 'string' || typeof x === 'number') parts.push(String(x));
      }
      report('console', parts.join(' '), st);
    }catch(e){}
    return origErr.apply(console, arguments);
  };
})();
</script>
<script>
(function(){
  // ⚠️ عدّل هاد السطر بعد ما تنشر سيرفر الموافقات (whatsapp-server) - حط رابط السيرفر هون بدون / بالآخر
  var ACCESS_SERVER_URL = 'https://merzona-server-production.up.railway.app';

  var DEVICE_KEY = 'merzona-device-token';
  var STATUS_KEY = 'merzona-access-status';
  // 🆕 2026-08-26: طبقة حسابات المستخدمين (يوزرنيم/باسوورد) فوق موافقة الواتساب. TOOL_PERMISSION_KEY
  // بيحدد شو اسم الصلاحية يلي هالملف بالذات لازم يتحقق منها (نفس مفاتيح PERMISSION_KEYS بالسيرفر) -
  // لازم يبقى 'procurement' هون بالضبط (بملف procurement.html)، وبملفات Dashboard.html/index.html
  // القيمة المكافئة هي 'dashboard'/'quotation' على التوالي.
  var SESSION_KEY = 'merzona-session-token';
  // 🆕 2026-08-26: اسم المستخدم (يوزرنيم) محفوظ محليًا بعد إنشاء/تسجيل الدخول - نفس الفكرة يلي
  // بأداة عرض الأسعار (index.html)، محفوظ هون كمان للتناسق (ما بتستخدمو هالأداة حاليًا).
  var USERNAME_KEY = 'merzona-username';
  var TOOL_PERMISSION_KEY = 'accounting';
  var POLL_MS = 4000;
  var REVALIDATE_MS = 5 * 60 * 1000; // كل قد ايش نتأكد من السيرفر إنو الجهاز المعتمد لسا مسموح (يلتقط أي إلغاء وصول بسرعة معقولة حتى لو الصفحة ضلت مفتوحة)

  // ===== فحص تلقائي لآخر نسخة منشورة (يحل مشكلة "المتصفح عم يعرض نسخة قديمة مخزنة") =====
  // 🔔 لازم تتحدث CURRENT_VERSION هون كل مرة يصير فيها تعديل جديد على هاد الملف، بنفس الوقت يلي
  // بينحدث فيه رقم النسخة تبع "procurement" جوا ملف version.json (لازم يترفع مع كل تحديث كمان).
  var CURRENT_VERSION = '2026-11-13.3';
  window.__mzVersion = CURRENT_VERSION;
  var TOOL_KEY = 'accounting';
  var VERSION_URL = 'version.json';
  var RELOAD_GUARD_KEY = 'merzona-version-guard-' + TOOL_KEY;
  var VERSION_CHECK_TIMEOUT_MS = 4000;

  function checkForUpdate(onDone){
    var bust = Date.now() + '-' + Math.random().toString(16).slice(2);
    var settled = false;
    var timer = setTimeout(function(){ if(!settled){ settled = true; onDone(); } }, VERSION_CHECK_TIMEOUT_MS);
    fetch(VERSION_URL + '?_=' + bust, { cache: 'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data){
        if(settled) return; settled = true; clearTimeout(timer);
        var remoteVersion = data && data[TOOL_KEY];
        if(!remoteVersion || remoteVersion === CURRENT_VERSION){
          try{ sessionStorage.removeItem(RELOAD_GUARD_KEY); }catch(e){}
          onDone();
          return;
        }
        // في نسخة أحدث منشورة على جيت هاب من يلي المتصفح فاتحها حاليًا - منعمل reload بس مع رابط
        // مختلف (cache-busting) حتى نجبر المتصفح ياخد نسخة الملف الجديدة فعليًا من الشبكة مباشرة،
        // بدل ما يكتفي بالنسخة القديمة المخزنة عندو محليًا.
        var guard = null;
        try{ guard = JSON.parse(sessionStorage.getItem(RELOAD_GUARD_KEY) || 'null'); }catch(e){}
        if(guard && guard.version === remoteVersion && (Date.now() - guard.at) < 60000){
          // جربنا نحدّث لهاي النسخة قبل شوي وما زبط (يمكن لسا عم تنتشر على سيرفرات جيت هاب) - منكمل
          // بالنسخة الحالية حتى ما تعلق الأداة بحلقة تحديث متكررة، ومنعاود نحاول بعد شوي من جديد.
          onDone();
          return;
        }
        try{ sessionStorage.setItem(RELOAD_GUARD_KEY, JSON.stringify({ version: remoteVersion, at: Date.now() })); }catch(e){}
        var _qs = ''; try { var _u = new URLSearchParams(location.search); _u.set('_cb', bust); _qs = '?' + _u.toString(); } catch (e) { _qs = '?_cb=' + bust; }
        location.replace(location.pathname + _qs + (location.hash || ''));
      })
      .catch(function(){ if(!settled){ settled = true; clearTimeout(timer); onDone(); } });
  }

  function showCheckingUpdate(){
    var overlay = buildOverlayShell();
    overlay.querySelector('.mz-gate-box').innerHTML =
      '<div style="font-size:13px;color:#9aa0aa">🔄 جاري التحقق من آخر نسخة...</div>';
  }

  function getDeviceToken(){
    var t = null;
    try{ t = localStorage.getItem(DEVICE_KEY); }catch(e){}
    if(!t){
      t = (crypto.randomUUID ? crypto.randomUUID() : ('dev-' + Date.now() + '-' + Math.random().toString(16).slice(2)));
      try{ localStorage.setItem(DEVICE_KEY, t); }catch(e){}
    }
    return t;
  }

  function reveal(){
    var st = document.getElementById('mz-gate-style'); if(st) st.remove();
    var ov = document.getElementById('mz-gate-overlay'); if(ov) ov.remove();
  }

  // ============================================================================
  // 🆕 2026-08-26: حسابات المستخدمين (يوزرنيم/باسوورد) - طبقة إضافية فوق موافقة الواتساب
  // أعلاه. ما بتشتغل إلا بعد ما الجهاز يصير "approved". مسار المالك (#owner=) ما بيمرق من
  // هون إطلاقًا - بيرجع reveal() مباشرة (شوف init() تحت).
  // ============================================================================
  function getSessionToken(){
    try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; }
  }
  function setSessionToken(t, username){
    try{
      localStorage.setItem(SESSION_KEY, t);
      if(username) localStorage.setItem(USERNAME_KEY, username);
    }catch(e){}
  }

  // متل api() تمامًا بس ما بترمي خطأ عالحالات 4xx/5xx - بترجع نفس جسم JSON يلي بعتو السيرفر
  // (فيه رسالة الخطأ بالعربي بحقل error) حتى نقدر نعرضها للمستخدم بدل رسالة عامة.
  function apiUsers(path, opts){
    return fetch(ACCESS_SERVER_URL + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; });
    });
  }

  function showBlockedNoPermission(){
    var overlay = buildOverlayShell();
    overlay.querySelector('.mz-gate-box').innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px;color:#e0554f">ما عندك صلاحية</div>' +
      '<div style="font-size:13px;color:#9aa0aa">حسابك مسموح بالدخول، بس ما عندك صلاحية لهاد الجزء تحديدًا. تواصل مع الإدارة إذا حابب توصلها.</div>';
  }

  function proceedIfPermitted(permissions){
    if(permissions && permissions[TOOL_PERMISSION_KEY]){
      reveal();
    } else {
      showBlockedNoPermission();
    }
  }

  function showAccountError(box, msg){
    var err = box.querySelector('#mz-acct-err');
    if(err) err.textContent = msg || 'صار في خطأ - جرب كمان شوي';
  }

  function showCreateAccountForm(deviceToken){
    var overlay = buildOverlayShell();
    var box = overlay.querySelector('.mz-gate-box');
    box.innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px">آخر خطوة - أنشئ حسابك 🔐</div>' +
      '<div style="font-size:13px;color:#9aa0aa;margin-bottom:18px">اختار اسم مستخدم وكلمة مرور خاصين فيك، رح تحتاجهم بالمرات الجاية</div>' +
      '<input id="mz-acct-user" type="text" placeholder="اسم المستخدم" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<input id="mz-acct-pass" type="password" placeholder="كلمة المرور (6 أحرف عالأقل)" autocomplete="new-password" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<input id="mz-acct-pass2" type="password" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<button id="mz-acct-btn" style="width:100%;padding:10px 12px;border-radius:8px;border:none;background:#0f88cd;color:#fff;font-size:14px;font-weight:600;cursor:pointer">إنشاء الحساب</button>' +
      '<div id="mz-acct-err" style="color:#e0554f;font-size:12px;margin-top:10px;min-height:16px"></div>';
    var btn = box.querySelector('#mz-acct-btn');
    var userInput = box.querySelector('#mz-acct-user');
    var passInput = box.querySelector('#mz-acct-pass');
    var pass2Input = box.querySelector('#mz-acct-pass2');
    function submit(){
      var username = (userInput.value || '').trim();
      var password = passInput.value || '';
      var password2 = pass2Input.value || '';
      if(!username || username.length < 2){ showAccountError(box, 'اكتب اسم مستخدم صحيح'); return; }
      if(password.length < 6){ showAccountError(box, 'كلمة المرور لازم تكون 6 أحرف عالأقل'); return; }
      if(password !== password2){ showAccountError(box, 'كلمتا المرور مش متطابقتين'); return; }
      btn.disabled = true; btn.textContent = 'جاري الإنشاء...';
      apiUsers('/users/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceToken: deviceToken, username: username, password: password })
      }).then(function(r){
        if(r && r.token){
          setSessionToken(r.token, r.username);
          proceedIfPermitted(r.isAdmin ? { accounting: true } : r.permissions);
        } else {
          btn.disabled = false; btn.textContent = 'إنشاء الحساب';
          showAccountError(box, (r && r.error) || 'صار في خطأ');
        }
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'إنشاء الحساب';
        showAccountError(box, 'تعذر الاتصال بالسيرفر');
      });
    }
    btn.addEventListener('click', submit);
    pass2Input.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
    setTimeout(function(){ userInput.focus(); }, 50);
  }

  function showLoginForm(deviceToken, prefillUsername){
    var overlay = buildOverlayShell();
    var box = overlay.querySelector('.mz-gate-box');
    var safePrefill = prefillUsername ? String(prefillUsername).replace(/"/g,'&quot;') : '';
    box.innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px">سجّل الدخول 🔐</div>' +
      '<div style="font-size:13px;color:#9aa0aa;margin-bottom:18px">اكتب اسم المستخدم وكلمة المرور يلي أنشأتهم قبل هيك</div>' +
      '<input id="mz-acct-user" type="text" placeholder="اسم المستخدم" value="' + safePrefill + '" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<input id="mz-acct-pass" type="password" placeholder="كلمة المرور" autocomplete="current-password" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<button id="mz-acct-btn" style="width:100%;padding:10px 12px;border-radius:8px;border:none;background:#0f88cd;color:#fff;font-size:14px;font-weight:600;cursor:pointer">دخول</button>' +
      '<div id="mz-acct-err" style="color:#e0554f;font-size:12px;margin-top:10px;min-height:16px"></div>';
    var btn = box.querySelector('#mz-acct-btn');
    var userInput = box.querySelector('#mz-acct-user');
    var passInput = box.querySelector('#mz-acct-pass');
    function submit(){
      var username = (userInput.value || '').trim();
      var password = passInput.value || '';
      if(!username || !password){ showAccountError(box, 'عبي الاسم وكلمة المرور'); return; }
      btn.disabled = true; btn.textContent = 'جاري الدخول...';
      apiUsers('/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      }).then(function(r){
        if(r && r.token){
          setSessionToken(r.token, r.username);
          proceedIfPermitted(r.isAdmin ? { accounting: true } : r.permissions);
        } else {
          btn.disabled = false; btn.textContent = 'دخول';
          showAccountError(box, (r && r.error) || 'اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'دخول';
        showAccountError(box, 'تعذر الاتصال بالسيرفر');
      });
    }
    btn.addEventListener('click', submit);
    passInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
    setTimeout(function(){ passInput.focus(); }, 50);
  }

  // هاد يلي بيستبدل استدعاءات reveal() المباشرة (ما عدا مسار المالك #owner=) - بيتحقق أول
  // شي إذا الجهاز عملّو حساب يوزرنيم/باسوورد، وإذا لأ بيطلب منه ينشئ واحد قبل ما يفوت.
  function revealWithAccountCheck(deviceToken){
    apiUsers('/users/status?deviceToken=' + encodeURIComponent(deviceToken)).then(function(r){
      if(r && r.isOwnerDevice){
        // جهاز المالك المعتمد أصلاً (دخل قبل هيك عن طريق #owner=) - فوري وبدون أي حساب.
        reveal();
      } else if(r && r.hasAccount){
        var token = getSessionToken();
        if(!token){ showLoginForm(deviceToken, r.username); return; }
        apiUsers('/users/me?token=' + encodeURIComponent(token)).then(function(me){
          if(me && me.permissions){ proceedIfPermitted(me.isAdmin ? { accounting: true } : me.permissions); }
          else { showLoginForm(deviceToken, r.username); }
        }).catch(function(){ showLoginForm(deviceToken, r.username); });
      } else if(r && r.hasAccount === false){
        showCreateAccountForm(deviceToken);
      } else {
        // رد غير متوقع (مثلاً الجهاز مش approved من نظام الواتساب لأي سبب) - منكمل بالوضع
        // القديم حتى ما حدا ينحبس برا الأداة بسبب ميزة جديدة.
        reveal();
      }
    }).catch(function(){
      reveal();
    });
  }

  function getOwnerTokenFromHash(){
    var m = /[#&]owner=([^&]+)/.exec(location.hash);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function clearOwnerHash(){
    if(location.hash.indexOf('owner=') !== -1){
      try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    }
  }

  function api(path, opts){
    return fetch(ACCESS_SERVER_URL + path, opts).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function buildOverlayShell(){
    var existing = document.getElementById('mz-gate-overlay');
    if(existing) return existing;
    var overlay = document.createElement('div');
    overlay.id = 'mz-gate-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:#0f1115;color:#eee;display:flex;align-items:center;justify-content:center;z-index:2147483647;font-family:Tahoma,Arial,sans-serif;direction:rtl;';
    var box = document.createElement('div');
    box.className = 'mz-gate-box';
    box.style.cssText = 'background:#1b1e24;padding:32px 28px;border-radius:12px;max-width:340px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)';
    overlay.appendChild(box);
    document.documentElement.appendChild(overlay);
    return overlay;
  }

  function showMisconfigured(){
    var overlay = buildOverlayShell();
    overlay.querySelector('.mz-gate-box').innerHTML =
      '<div style="font-size:16px;font-weight:700;margin-bottom:10px">نظام الدخول مش جاهز بعد</div>' +
      '<div style="font-size:13px;color:#9aa0aa">تواصل مع الإدارة لتفعيل رابط سيرفر الموافقات.</div>';
  }

  function showRequestForm(deviceToken){
    var overlay = buildOverlayShell();
    var box = overlay.querySelector('.mz-gate-box');
    box.innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px">أداة ميرزونا محمية</div>' +
      '<div style="font-size:13px;color:#9aa0aa;margin-bottom:18px">اكتب اسمك واطلب الدخول - رح توصل موافقة الإدارة على الواتس اب</div>' +
      '<input id="mz-gate-name" type="text" placeholder="اسمك" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #333;background:#0f1115;color:#eee;font-size:14px;box-sizing:border-box;margin-bottom:10px" />' +
      '<button id="mz-gate-btn" style="width:100%;padding:10px 12px;border-radius:8px;border:none;background:#0f88cd;color:#fff;font-size:14px;font-weight:600;cursor:pointer">طلب الدخول</button>' +
      '<div id="mz-gate-err" style="color:#e0554f;font-size:12px;margin-top:10px;min-height:16px"></div>';
    var btn = box.querySelector('#mz-gate-btn');
    var nameInput = box.querySelector('#mz-gate-name');
    var err = box.querySelector('#mz-gate-err');
    function submit(){
      var name = (nameInput.value || '').trim();
      btn.disabled = true; btn.textContent = 'جاري الإرسال...';
      // منبعت نفس القيمة المكتوبة كـ adminToken كمان مع الاسم - السيرفر بتجاهلها إذا مش نفس
      // كلمة سر المالك بالضبط، وبيوافق فورًا بدون انتظار الواتس اب إذا كانت مطابقة. هيك صاحبة
      // الأداة فيها تكتب كلمة السر مكان الاسم وتفتح مباشرة، بدون الحاجة لرابط #owner= الخاص.
      api('/access/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceToken: deviceToken, name: name, adminToken: name })
      }).then(function(r){
        if(r.status === 'approved'){
          try{ localStorage.setItem(STATUS_KEY, 'approved'); }catch(e){}
          revealWithAccountCheck(deviceToken);
        } else {
          showWaiting(deviceToken);
        }
      }).catch(function(){
        btn.disabled = false; btn.textContent = 'طلب الدخول';
        err.textContent = 'تعذر الاتصال بسيرفر الموافقات - جرب كمان شوي';
      });
    }
    btn.addEventListener('click', submit);
    nameInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
    setTimeout(function(){ nameInput.focus(); }, 50);
  }

  function showWaiting(deviceToken){
    var overlay = buildOverlayShell();
    var box = overlay.querySelector('.mz-gate-box');
    box.innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px">بانتظار موافقة الإدارة ⏳</div>' +
      '<div style="font-size:13px;color:#9aa0aa">وصل طلبك - الصفحة رح تفتح تلقائيًا أول ما توافق الإدارة</div>';
    var poll = setInterval(function(){
      api('/access/status?device=' + encodeURIComponent(deviceToken)).then(function(r){
        if(r.status === 'approved'){
          clearInterval(poll);
          try{ localStorage.setItem(STATUS_KEY, 'approved'); }catch(e){}
          revealWithAccountCheck(deviceToken);
        } else if(r.status === 'denied' || r.status === 'revoked'){
          clearInterval(poll);
          try{ localStorage.removeItem(STATUS_KEY); }catch(e){}
          showRejected();
        }
      }).catch(function(){ /* السيرفر مش متاح مؤقتًا - منستمر نحاول بصمت */ });
    }, POLL_MS);
  }

  function showRejected(){
    var overlay = buildOverlayShell();
    var box = overlay.querySelector('.mz-gate-box');
    box.innerHTML =
      '<div style="font-size:18px;font-weight:700;margin-bottom:6px;color:#e0554f">ما توفرت الموافقة</div>' +
      '<div style="font-size:13px;color:#9aa0aa;margin-bottom:18px">تواصل مع الإدارة، أو جرب تطلب دخول من جديد</div>' +
      '<button id="mz-gate-retry" style="width:100%;padding:10px 12px;border-radius:8px;border:none;background:#0f88cd;color:#fff;font-size:14px;font-weight:600;cursor:pointer">حاول من جديد</button>';
    box.querySelector('#mz-gate-retry').addEventListener('click', function(){ location.reload(); });
  }

  function init(){
    var deviceToken = getDeviceToken();
    var ownerToken = getOwnerTokenFromHash();

    var cachedStatus = null;
    try{ cachedStatus = localStorage.getItem(STATUS_KEY); }catch(e){}

    if(!ACCESS_SERVER_URL){
      if(cachedStatus === 'approved'){ reveal(); return; }
      showMisconfigured();
      return;
    }

    if(ownerToken){
      api('/access/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ deviceToken: deviceToken, name: 'Owner', adminToken: ownerToken })
      }).then(function(r){
        clearOwnerHash();
        if(r.status === 'approved'){
          try{ localStorage.setItem(STATUS_KEY, 'approved'); }catch(e){}
          reveal();
        } else {
          showRequestForm(deviceToken);
        }
      }).catch(function(){ clearOwnerHash(); showRequestForm(deviceToken); });
      return;
    }

    if(cachedStatus === 'approved'){
      revealWithAccountCheck(deviceToken); // نفتح فورًا (تفاؤلي)، وبنتأكد بالخلفية بشكل دوري إذا لسا الموافقة سارية
      function revalidate(){
        api('/access/status?device=' + encodeURIComponent(deviceToken)).then(function(r){
          if(r.status !== 'approved'){
            try{ localStorage.removeItem(STATUS_KEY); }catch(e){}
            location.reload();
          }
        }).catch(function(){});
      }
      revalidate();
      setInterval(revalidate, REVALIDATE_MS);
      return;
    }

    api('/access/status?device=' + encodeURIComponent(deviceToken)).then(function(r){
      if(r.status === 'approved'){
        try{ localStorage.setItem(STATUS_KEY, 'approved'); }catch(e){}
        revealWithAccountCheck(deviceToken);
      } else if(r.status === 'pending'){
        showWaiting(deviceToken);
      } else {
        showRequestForm(deviceToken);
      }
    }).catch(function(){
      showRequestForm(deviceToken);
    });
  }

  function boot(){
    showCheckingUpdate();
    checkForUpdate(init);
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script>

<header class="top"><div class="in">
  <h1>📒 المحاسبة — ميرزونا</h1>
  <span id="bookChips"></span>
  <button class="chip" id="aiBtn" title="المساعد المحاسبي (ذكاء اصطناعي)" onclick="aiOpen()" style="background:#0f88cd;color:#fff;font-weight:700;">💬 المساعد</button>
  <button class="chip" id="reloadBtn" title="تحديث من السيرفر">🔄</button>
</div></header>

<div class="wrap" id="app"><div class="state">⏳ جاري تحميل الدفتر...</div></div>

<script>
(function(){
'use strict';
var C = window.AcctCore;
var SERVER = 'https://merzona-server-production.up.railway.app';
var LS_BOOK = 'merzona-acct-book', LS_TAB = 'merzona-acct-tab';
var S = { bookId: lsGet(LS_BOOK) || 'uae', book: null, me: null, tab: lsGet(LS_TAB) || 'home', busy: false, filters: {} };
var app = document.getElementById('app');

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
// أرقام: بيقبل الأرقام العربية (٠١٢) والفواصل (1,250.50 أو ١٬٢٥٠٫٥٠). لو الرقم غلط منبعتو متل ما هو حتى الفحص يرفضو - ما منحوّلو لصفر بالسر
function pn(v){
  if(v === null || v === undefined) return '';
  if(typeof v === 'number') return v;
  var t = String(v).trim().replace(/[\u0660-\u0669]/g, function(c){ return String(c.charCodeAt(0) - 0x0660); }).replace(/[\u06F0-\u06F9]/g, function(c){ return String(c.charCodeAt(0) - 0x06F0); })
    .replace(/\u066B/g, '.').replace(/\u066C/g, ',').replace(/\s/g, '');
  if(t === '') return '';
  // الفاصلة مقبولة بس كفاصل آلاف صحيح (1,250 أو 12,500.50) - "1,5" مش رقم (ممكن يكون قصدك 1.5) فمنرفضو
  if(t.indexOf(',') !== -1){ if(!/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) return String(v); t = t.replace(/,/g, ''); }
  return /^-?(\d+\.?\d*|\.\d+)$/.test(t) ? Number(t) : String(v);
}
// سعر الصرف بالشكل الطبيعي: 1 USD = 3.6725 AED (دفتر الإمارات) أو 1 USD = 13000 SYP (دفتر سوريا)
// داخليًا fx = كم وحدة من عملة المستند = 1 من عملة الدفتر
function fxNatural(fx, cur){ fx = Number(fx); if(!(fx > 0)) return ''; var v = cur === 'USD' && base() !== 'USD' ? 1 / fx : fx; return String(Number(v.toPrecision(10))); }
function fxFromNatural(v, cur){ var n = pn(v); if(n === '') return ''; if(typeof n !== 'number' || !(n > 0)) return v; return cur === 'USD' && base() !== 'USD' ? Number((1 / n).toPrecision(12)) : n; }
function fxLabel(cur){ return cur === 'USD' && base() !== 'USD' ? '1 USD = كم ' + base() : '1 ' + base() + ' = كم ' + cur; }
function fxPlausible(cur, nat){ nat = Number(nat); if(cur === 'USD' && base() === 'AED') return nat >= 3.5 && nat <= 3.9; if(cur === 'SYP') return nat >= 1000 && nat <= 100000; return true; }
function pv(v){ var n = pn(v); return typeof n === 'number' && isFinite(n) ? n : 0; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function money(n, cur){ return C.fmt(n, cur); }
function base(){ return S.book ? S.book.base : 'AED'; }
function toast(msg, ms){ var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms || 2600); }
function acctName(code){ var a = (S.book.accounts || []).find(function(x){ return x.code === code; }); return a ? a.code + ' · ' + a.name : code; }
function partyName(id){ var p = S.book.parties[id]; return p ? p.name : (id ? '؟' : ''); }
function isAdmin(){ return S.me && S.me.admin; }

/* ---------------------------- الاتصال بالسيرفر ---------------------------- */
function headers(){
  return { 'Content-Type': 'application/json', 'x-device': lsGet('merzona-device-token') || '', 'x-session': lsGet('merzona-session-token') || '' };
}
// كل طلب إلو مهلة دقيقة: إذا السيرفر ما رد منقول هيك بوضوح بدل ما الصفحة تضل "عم تحمّل" للأبد
function api(method, path, body){
  var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var tm = ctl ? setTimeout(function(){ ctl.abort(); }, 60000) : null;
  return fetch(SERVER + path, { method: method, headers: headers(), body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function(r){ clearTimeout(tm); return r.json().catch(function(){ return {}; }).then(function(j){ j.__status = r.status; return j; }); },
          function(e){ clearTimeout(tm); if(e && e.name === 'AbortError') return { __status: 0, error: 'timeout' }; throw e; });
}
function load(keepTab){
  app.innerHTML = '<div class="state">⏳ جاري تحميل ' + esc(C.BOOKS[S.bookId].name) + '...</div>';
  return api('GET', '/acct/' + S.bookId).then(function(r){
    if(r.__status !== 200){
      var msg = r.error === 'login-required' ? 'لازم تسجّل دخول بحسابك أول (من الداشبورد).' :
                r.error === 'no-accounting-permission' ? 'ما عندك صلاحية المحاسبة. الأدمن بيفتحها من صفحة المستخدمين.' :
                r.error === 'unauthorized' ? 'هالجهاز مش معتمد.' : 'تعذّر تحميل الدفتر (' + (r.error || r.__status) + ').';
      app.innerHTML = '<div class="state dng">⚠️ ' + esc(msg) + '<br><br><button onclick="location.reload()">إعادة المحاولة</button></div>';
      return;
    }
    S.book = r.book; S.me = r.me;
    // فحص سلامة محلي كمان (نفس الكود يلي بالسيرفر)
    var probs = C.integrity(S.book);
    if(probs.length) toast('⚠️ فحص السلامة: ' + probs[0], 6000);
    render();
  }).catch(function(){
    app.innerHTML = '<div class="state dng">⚠️ ما في اتصال بالسيرفر. تأكد من النت وجرّب مرة تانية.<br><br><button onclick="location.reload()">إعادة المحاولة</button></div>';
  });
}
function op(name, data, okMsg){
  if(S.busy) return Promise.resolve({ errors: ['في عملية قبلها لسا عم تنحفظ - استنى كم ثانية وجرّب'] });
  S.busy = true;
  return api('POST', '/acct/' + S.bookId + '/op', { op: name, data: data, baseRev: S.book.rev }).then(function(r){
    S.busy = false;
    if(r.__status === 200){ if(okMsg) toast(okMsg); return load(true).then(function(){ return r; }); }
    if(r.__status === 409 && r.error === 'doc-changed'){ var e409 = r.errors || ['حدا تاني عدّل هالمستند - حدّثنا الدفتر']; return load(true).then(function(){ return { errors: e409 }; }); }
    if(r.__status === 409){ toast('في تعديل من جهاز تاني - حدّثنا الدفتر، جرّب مرة تانية'); return load(true).then(function(){ return null; }); }
    if(r.error === 'timeout') return load(true).then(function(){ return { errors: ['السيرفر ما رد خلال دقيقة. حدّثنا الدفتر - شوف إذا انحفظ قبل ما تعيد المحاولة'] }; });
    var errs = r.errors || r.problems || [r.error || ('خطأ ' + r.__status)];
    return { errors: errs };
  }).catch(function(){ S.busy = false; return { errors: ['ما في اتصال بالسيرفر - ما انحفظ شي'] }; });
}

/* ---------------------------- الهيكل ---------------------------- */
var TABS = [
  ['home','🏠 الرئيسية'],['sales','🧾 المبيعات'],['purch','🛒 المشتريات والمصاريف'],['bank','🏦 البنوك والصناديق'],
  ['parties','👥 الزبائن والموردين'],['journal','📒 القيود والأستاذ'],['reports','📊 التقارير'],['settings','⚙️ الإعدادات']
];
function renderChrome(){
  document.getElementById('bookChips').innerHTML = Object.keys(C.BOOKS).map(function(id){
    var b = C.BOOKS[id];
    return '<button class="chip' + (id === S.bookId ? ' on' : '') + '" data-book="' + id + '">' + (id === 'uae' ? '🇦🇪' : '🇸🇾') + ' ' + esc(b.name) + ' · ' + b.base + '</button> ';
  }).join('');
  document.querySelectorAll('[data-book]').forEach(function(b){ b.onclick = function(){ S.bookId = b.dataset.book; lsSet(LS_BOOK, S.bookId); S.filters = {}; renderChrome(); load(); }; });
  document.getElementById('tabs').innerHTML = TABS.map(function(t){ return '<button data-tab="' + t[0] + '" class="' + (t[0] === S.tab ? 'on' : '') + '">' + t[1] + '</button>'; }).join('');
  document.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick = function(){ S.tab = b.dataset.tab; lsSet(LS_TAB, S.tab); renderChrome(); render(); }; });
}
document.getElementById('reloadBtn').onclick = function(){ load(true); };

function render(){
  renderChrome();
  if(!S.book) return;
  var fn = { home: vHome, sales: vSales, purch: vPurch, bank: vBank, parties: vParties, journal: vJournal, reports: vReports, settings: vSettings }[S.tab] || vHome;
  try{ app.innerHTML = ''; fn(); }
  catch(e){ console.error(e); app.innerHTML = '<div class="state dng">صار خطأ بالعرض: ' + esc(e.message) + '</div>'; }
}
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
function panel(title, inner){ var p = el('<div class="panel">' + (title ? '<h2>' + title + '</h2>' : '') + '</div>'); if(typeof inner === 'string') p.insertAdjacentHTML('beforeend', inner); else if(inner) p.appendChild(inner); app.appendChild(p); return p; }
function quickActions(types){
  return '<div class="bar">' + types.map(function(t){ return '<button class="pri sm" data-new="' + t + '">+ ' + esc(C.DOC_TYPES[t].label) + '</button>'; }).join('') + '</div>';
}

function docStatus(d){
  if(d.void) return '<span class="tag void">ملغى</span>';
  var k = C.itemKind(d);
  if(k){
    var open = C.openBalanceOf(S.book, d.id), tot = C.itemTotal(d, S.book);
    if(open <= 0.004) return '<span class="tag ok">مدفوعة</span>';
    var due = d.due || (d.openItem && d.openItem.due) || d.date;
    if(due < today()) return '<span class="tag dng">متأخرة</span>';
    return open < tot ? '<span class="tag wrn">مدفوعة جزئيًا</span>' : '<span class="tag">مفتوحة</span>';
  }
  if(d.type === 'receipt' || d.type === 'vpayment' || d.type === 'credit' || d.type === 'vcredit'){
    var lim = (d.type === 'receipt' || d.type === 'vpayment') ? C.num(d.amount) : C.docTotals(d, S.book).total;
    var ap = C.r2((d.applies || []).reduce(function(s, a){ return s + C.num(a.amount); }, 0));
    return ap < lim - 0.004 ? '<span class="tag wrn">غير مطبّق ' + money(lim - ap) + '</span>' : '<span class="tag ok">مطبّق</span>';
  }
  return '';
}
function docList(types, title){

/* ---------------------------- نافذة عامة ---------------------------- */
function modal(title, bodyHtml, buttons){
  var bg = el('<div class="modal-bg"><div class="modal"><div class="mh"><h3>' + title + '</h3><button class="sm" data-x>✕</button></div><div class="mb"><div class="errbox"></div>' + bodyHtml + '</div><div class="mf"></div></div></div>');
  document.body.appendChild(bg);
  var api_ = { el: bg, body: bg.querySelector('.mb'), q: function(s){ return bg.querySelector(s); }, qa: function(s){ return bg.querySelectorAll(s); },
    close: function(){ bg.remove(); document.removeEventListener('keydown', onKey); },
    errors: function(list){ var eb = bg.querySelector('.errbox'); eb.innerHTML = list && list.length ? '<div class="errs"><b>ما انحفظ - صحّح هدول:</b><ul>' + list.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' : ''; if(list && list.length) eb.scrollIntoView({ block: 'nearest' }); } };
  (buttons || []).forEach(function(b){ var btn = el('<button class="' + (b[1] || '') + '">' + b[0] + '</button>'); btn.onclick = b[2]; bg.querySelector('.mf').appendChild(btn); });
  var cl = el('<button>إغلاق</button>'); cl.onclick = api_.close; bg.querySelector('.mf').appendChild(cl);
  bg.querySelector('[data-x]').onclick = api_.close;
  function onKey(e){ if(e.key === 'Escape') api_.close(); }
  document.addEventListener('keydown', onKey);
  return api_;
}

function aiAddFiles(list){
  Array.prototype.slice.call(list || []).forEach(function(f){
    if(AI.files.length >= 4){ toast('4 ملفات بالرسالة الوحدة كحد أقصى'); return; }
    if(f.size > 12 * 1024 * 1024){ toast('الملف ' + f.name + ' أكبر من 12MB'); return; }
    var add = function(o){ AI.files.push(o); aiChips(); };
    if(/^image\//.test(f.type)){
      var fr = new FileReader(); fr.onload = function(){ var img = new Image(); img.onload = function(){ var k = Math.min(1, 1800 / Math.max(img.width, img.height)); var c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); add({ name: f.name, mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] }); }; img.src = fr.result; }; fr.readAsDataURL(f);
    } else if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)){
      var fr2 = new FileReader(); fr2.onload = function(){ add({ name: f.name, mime: 'application/pdf', data: String(fr2.result).split(',')[1] }); }; fr2.readAsDataURL(f);
    } else if(/\.(csv|txt)$/i.test(f.name) || /^text\//.test(f.type)){
      var fr3 = new FileReader(); fr3.onload = function(){ add({ name: f.name, mime: 'text/plain', text: String(fr3.result).slice(0, 60000) }); }; fr3.readAsText(f);
    } else toast('نوع الملف مش مدعوم: صور، PDF، CSV أو نص. (Excel: احفظه CSV)');
  });
}

        r.error === 'budget-reached' ? '⚠️ خلص الحد الشهري للمساعد (' + (r.status ? r.status.monthlyUsd : '') + '$). المالك فيه يغيّره من تحت.' :

// المسودة → مستند جاهز للفحص (نفس شكل الحفظ العادي)
function aiDocFrom(a){
  var B = S.book, d = JSON.parse(JSON.stringify(a.doc || {}));
  var o = { type: d.type, date: C.isDate(d.date) ? d.date : today(), currency: d.currency || base() };
  if(o.currency !== base()) o.fx = pn(d.fx);
  if(d.partyId) o.partyId = d.partyId;
  ['acct', 'from', 'to', 'payee', 'project', 'ref', 'due'].forEach(function(k){ if(d[k] != null && d[k] !== '') o[k] = String(d[k]); });
  if(d.amount != null) o.amount = pn(d.amount);
  o.notes = ('🤖 من المساعد' + (d.notes ? ': ' + d.notes : '')).slice(0, 1000);
  var t = o.type;
  if(Array.isArray(d.lines)){
    o.lines = d.lines.map(function(l){
      if(t === 'journal') return { acct: String(l.acct || ''), party: l.party || '', dr: pn(l.dr || ''), cr: pn(l.cr || ''), memo: l.memo || '', project: l.project || '' };
      var x = { desc: String(l.desc || ''), acct: String(l.acct || ''), tax: !!l.tax && C.num(B.settings.vatRate) > 0 };
      if(['invoice', 'credit', 'bill', 'vcredit'].indexOf(t) !== -1){ x.qty = pn(l.qty == null || l.qty === '' ? 1 : l.qty); x.price = pn(l.price); } else x.amount = pn(l.amount);
      if(l.project) x.project = l.project;
      return x;
    });
  }
  if(['receipt', 'vpayment', 'credit', 'vcredit'].indexOf(t) !== -1) o.applies = (Array.isArray(d.applies) ? d.applies : []).filter(function(x){ return x && x.docId; }).map(function(x){ return { docId: String(x.docId), amount: pn(x.amount) }; });
  o.taxRate = C.num(B.settings.vatRate) > 0 && (o.lines || []).some(function(l){ return l.tax; }) ? C.num(B.settings.vatRate) : 0;
  return o;
}
function aiActHtml(a, mi, ai){

  (o.applies || []).forEach(function(x){ var td = B.docs[x.docId]; rows.push(['على فاتورة', (td ? td.no : x.docId) + ': ' + money(x.amount, cur)]); });
  if(o.fx) rows.push(['سعر الصرف', fxLabel(cur) + ' = ' + fxNatural(o.fx, cur)]);

    h += '<div class="bt"><button type="button" class="pri" data-ok="' + mi + ':' + ai + '"' + (errs.length ? ' disabled' : '') + '>✓ اعتمد</button><button type="button" data-ed="' + mi + ':' + ai + '">✏️ عدّل</button><button type="button" data-no="' + mi + ':' + ai + '">✕ لا</button></div>';
  }
  return h + '</div>';
}
function aiErrors(a){

function aiEnsureParty(a){
  if(!a.newParty) return Promise.resolve(true);
  return op('saveParty', { name: a.newParty.name, kind: a.newParty.kind }, '').then(function(r){
    if(r && r.party){ a.doc.partyId = r.party.id; a.newParty = null; aiSave(); return true; }
    toast('⚠️ ما انضاف الطرف: ' + ((r && r.errors) || []).join('، ')); return false;
  });
}
function aiApprove(a, btn){
  if(!a || a.state) return;
  btn.disabled = true; btn.textContent = '⏳';
  aiEnsureParty(a).then(function(okP){
    if(!okP){ aiRender(); return; }
    var o = aiDocFrom(a), errs = C.validateDoc(o, S.book);
    if(errs.length){ toast('⚠️ ' + errs[0]); aiRender(); return; }
    if(o.currency && o.currency !== base() && !fxPlausible(o.currency, fxNatural(o.fx, o.currency)) && !confirm('سعر الصرف ' + fxLabel(o.currency) + ' = ' + fxNatural(o.fx, o.currency) + ' - هالسعر غريب. متأكد؟')){ aiRender(); return; }
    op('saveDoc', o).then(function(r){
      if(r && r.doc){ a.state = 'ok'; a.no = r.doc.no; a.id = r.doc.id; toast('✅ انحفظ ' + r.doc.no); }
      else toast('⚠️ ما انحفظ: ' + ((r && r.errors) || ['خطأ']).join('، '));

  });

function aiEdit(a){
  if(!a || a.state) return;
  aiEnsureParty(a).then(function(okP){
    if(!okP) return;
    var o = aiDocFrom(a);
    a._editing = true;
    openDoc(o);

    var known = {}; Object.keys(S.book.docs).forEach(function(k){ known[k] = 1; });
    var started = Date.now(), timer = setInterval(function(){
      var nd = Object.keys(S.book.docs).filter(function(k){ return !known[k]; }).map(function(k){ return S.book.docs[k]; }).find(function(d){ return /من المساعد/.test(d.notes || ''); });
      if(nd){ clearInterval(timer); a.state = 'ok'; a.no = nd.no; a.id = nd.id; aiSave(); aiRender(); return; }
      if(!document.querySelector('.modal-bg') || Date.now() - started > 15 * 60000){ clearInterval(timer); aiRender(); }
    }, 600);
  });
}

function coNameOf(n){
  n = n || '';
  try { var co = window.MzCompany && MzCompany.get(); if(co && !MzCompany.isDefault() && (!n.trim() || /^merzona$/i.test(n.trim()))) return co.nameEn + (co.nameAr ? ' · ' + co.nameAr : ''); } catch(e) {}
  return n || 'Merzona';
}
window.mzCoNameOf = coNameOf;
function printDoc(d){
  var B = S.book, st = B.settings, cur = d.currency || base(), t = C.docTotals(d, B), p = B.parties[d.partyId] || {};
  var uaeTax = S.bookId === 'uae' && C.num(d.taxRate) > 0;
  var titles = { invoice: uaeTax ? 'فاتورة ضريبية · Tax Invoice' : 'فاتورة · Invoice', credit: uaeTax ? 'إشعار دائن ضريبي · Tax Credit Note' : 'إشعار دائن · Credit Note', receipt: 'سند قبض · Receipt Voucher', vpayment: 'سند صرف · Payment Voucher', bill: 'فاتورة مورد · Bill', expense: 'سند مصروف · Expense', deposit: 'سند قبض · Deposit' };
  var html = '<div class="hd"><div><h1>' + esc(coName()) + '</h1>' + (st.address ? '<div>' + esc(st.address) + '</div>' : '') + (st.trn ? '<div>TRN: ' + esc(st.trn) + '</div>' : '') + '</div><div style="text-align:left"><h1>' + titles[d.type] + '</h1><div>No: <b>' + esc(d.no) + '</b></div><div>Date: ' + esc(d.date) + '</div>' + (d.due ? '<div>Due: ' + esc(d.due) + '</div>' : '') + '</div></div>';
  if(d.partyId) html += '<p><b>' + (C.DOC_TYPES[d.type].party === 'vendor' ? 'المورد' : 'الزبون') + ':</b> ' + esc(p.name) + (p.trn ? ' · TRN: ' + esc(p.trn) : '') + (p.phone ? ' · ' + esc(p.phone) : '') + (p.address ? '<br>' + esc(p.address) : '') + '</p>';
  if(d.project) html += '<p><b>المشروع / العقد:</b> ' + esc(d.project) + '</p>';
  if(d.lines && d.lines.length){
    var q = ['invoice','credit','bill','vcredit'].indexOf(d.type) !== -1;
    html += '<table border="1" cellspacing="0" cellpadding="6" style="width:100%;border-collapse:collapse;"><tr><th>#</th><th>البيان · Description</th>' + (q ? '<th>الكمية</th><th>السعر</th>' : '') + '<th>المبلغ · Amount</th>' + (uaeTax ? '<th>VAT ' + d.taxRate + '%</th>' : '') + '</tr>' +
      d.lines.map(function(l, i){ var a = q ? C.r2(C.num(l.qty === undefined ? 1 : l.qty) * C.num(l.price)) : C.num(l.amount); return '<tr><td>' + (i + 1) + '</td><td>' + esc(l.desc || '') + '</td>' + (q ? '<td class="n">' + esc(l.qty === undefined ? 1 : l.qty) + '</td><td class="n">' + money(l.price) + '</td>' : '') + '<td class="n">' + money(a) + '</td>' + (uaeTax ? '<td class="n">' + (l.tax ? money(C.r2(a * d.taxRate / 100)) : '0.00') + '</td>' : '') + '</tr>'; }).join('') + '</table>';
    html += '<table style="width:320px;margin-top:10px;margin-right:auto;"><tr><td>المجموع قبل الضريبة · Subtotal</td><td class="n">' + money(t.subtotal, cur) + '</td></tr>' + (uaeTax ? '<tr><td>ضريبة القيمة المضافة · VAT</td><td class="n">' + money(t.tax, cur) + '</td></tr>' : '') + '<tr><td><b>الإجمالي · Total</b></td><td class="n"><b>' + money(t.total, cur) + '</b></td></tr></table>';
  } else {
    html += '<p style="font-size:16px;">المبلغ · Amount: <b>' + money(d.amount, cur) + '</b></p>' + (d.acct ? '<p>' + (d.type === 'receipt' ? 'استلمنا على' : 'دفعنا من') + ': ' + esc(acctName(d.acct)) + '</p>' : '');
    if(d.applies && d.applies.length) html += '<p>مقابل: ' + d.applies.map(function(a){ var x = B.docs[a.docId] || {}; return esc(x.no || '') + ' (' + money(a.amount) + ')'; }).join('، ') + '</p>';
  }
  if(d.ref) html += '<p>المرجع: ' + esc(d.ref) + '</p>';
  if(d.notes) html += '<p>' + esc(d.notes) + '</p>';
  if(st.invoiceNote && (d.type === 'invoice' || d.type === 'credit')) html += '<p style="margin-top:20px;font-size:11px;">' + esc(st.invoiceNote) + '</p>';
  html += '<div style="display:flex;justify-content:space-between;margin-top:50px;"><div>التوقيع: ____________</div><div>الختم: ____________</div></div>';
  printHtml(html);
}

/* ---------------------------- CSV ---------------------------- */
function csvFromTable(tbl, name){
  var rows = Array.prototype.map.call(tbl.querySelectorAll('tr'), function(tr){ return Array.prototype.map.call(tr.querySelectorAll('th,td'), function(c){ var inp = c.querySelector('input'); var v = inp ? (inp.type === 'checkbox' ? (inp.checked ? '✔' : '') : inp.value) : c.innerText; return '"' + String(v).replace(/\s+/g, ' ').trim().replace(/"/g, '""') + '"'; }).join(','); });
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.join('\n')], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}

window.__acct = { S: S, load: load, render: render, openDoc: openDoc, viewDoc: viewDoc };
renderChrome();
if(!C){ app.innerHTML = '<div class="state dng">ملف الحسابات (acct-core.js) ما تحمّل - حدّث الصفحة.</div>'; }
else {
  // منستنى بوابة الدخول (موافقة الجهاز + تسجيل الدخول) تخلص قبل ما نحمّل الدفتر
  (function waitGate(){ if(document.getElementById('mz-gate-style')) return setTimeout(waitGate, 300); load(); })();
}
})();
